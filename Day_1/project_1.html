<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>

<body style="background-color: pink; text-align: center;">
    <h1>Registration Form</h1>

    <form>
        <label for="name">Name:</label>
        <input id="name" name="name" type="text" required>
        <br><br>

        <label for="email">Email address:</label>
        <input id="email" name="email" type="email" required>
        <br><br>


        <label for="Age">Age:</label>
        <input id="Age" name="Age" type="number" required>
        <br><br>


        <label for="Mob">Mobile Number:</label>
        <input id="Mob" name="Mob" type="number" required>
        <br><br>

        <label for="password">Password:</label>
        <input id="password" name="password" type="password" required>
        <br><br>

        <label for="Gender">Gender:</label>
        <!-- <input id="Gender" name="Gender" type="radio" required> -->
        <li>Male <input id="Gender" name="Gender" type="radio" required></li>
        <li>FeMale <input id="Gender" name="Gender" type="radio" required></li>
        <br><br>


        <label for="Department">Department:</label>
        CSE<input id="Department" name="Department" type="checkbox" required>
        IT<input id="Department" name="Department" type="checkbox" required>
        AIDS<input id="Department" name="Department" type="checkbox" required>
        ECE<input id="Department" name="Department" type="checkbox" required>
        <br><br>

        <label for="Address">Address:</label>
        <textarea id="Address" name="Address" required></textarea>
        <br><br>

        <input type="submit" value="Submit">
    </form>
</body>

</html>

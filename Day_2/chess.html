<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .chessboard {
            width: 480px;
            height: 480px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(8, 60px);
            border: 2px solid black;
        }

        .box {
            width: 60px;
            height: 60px;
        }

        .white_square {
            background-color: white;
        }

        .black_square {
            background-color: black;
        }
    </style>
</head>

<body>
    <div>
        <h1>Chess</h1> <br><br>
        <p>Welcome to the Chess game!</p><br><br>
    </div>


    <div class="chessboard">
        <!-- Row 1: starts black -->
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>

        <!-- Row 2: starts white -->
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>

        <!-- Row 3: starts black -->
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>

        <!-- Row 4: starts white -->
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>

        <!-- Row 5: starts black -->
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>

        <!-- Row 6: starts white -->
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>

        <!-- Row 7: starts black -->
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>

        <!-- Row 8: starts white -->
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>
        <div class="box white_square"></div>
        <div class="box black_square"></div>

    </div>
</body>

</html>

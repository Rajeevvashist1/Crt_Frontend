<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Login Page</title>
</head>
<body>
    <div style="width: 300px; margin: 100px auto; text-align: center; border: 1px solid #ccc; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);">
        <h1 style="color: #1877f2; ">Facebook</h1>
        <form>
            <p>Login to Facebook</p>
            <input type="email" placeholder="Email or Phone"> <br><br>
            <input type="password" placeholder="Password"> <br><br>
            <button type="submit" style="background-color: #1877f2; color: white; width: 100%; border: none; padding: 10px 20px; cursor: pointer;">Log In</button>
            <p style="margin-top: 10px;"><a href="#">Forgotten password?</a></p>
            <p style="margin-top: 10px;">Don't have an account? <a href="#">Sign Up</a></p>
        </form>
    </div>
</body>
</html>
